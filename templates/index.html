<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>値動きウォッチ(Web版)</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>値動きウォッチ(Web版・フェーズ8-4試作)</h1>
  <p class="note">
    今は「ウォッチリスト表示」「比較グラフ表示」「銘柄の表示・非表示」
    「銘柄の追加・削除」「実額表示・ソロ表示」だけをGUI化しています。用語集、
    ニュース、詳細チャート(ローソク足など)、値動き予測は、引き続き
    ターミナル版(<code>python main.py</code>)からご利用ください。データ
    (ウォッチリスト・株価)はどちらから操作しても共通なので、両方を
    使い分けても内容は同じです。
  </p>
</header>

<main>
  <section id="controls">
    <button id="fetch-btn">データを取得する(ターミナル版の「6」と同じ処理)</button>
    <label>
      表示期間:
      <select id="period-select">
        {% for label in period_options %}
        <option value="{{ loop.index0 }}" {% if loop.index0 == 3 %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      表示モード:
      <select id="mode-select">
        <option value="percent" selected>変化率(%)</option>
        <option value="absolute">実額</option>
      </select>
    </label>
    <button id="show-all-btn" class="btn-secondary">全ての銘柄を表示に戻す</button>
    <span id="status-text"></span>
  </section>
  <p id="mode-note" class="note-small"></p>

  <section id="chart-section">
    <div id="chart-container">
      <canvas id="priceChart"></canvas>
      <div id="chart-tooltip" class="chart-tooltip"></div>
    </div>
    <ul id="chart-legend"></ul>
  </section>

  <section id="add-company-section">
    <h2>銘柄を追加する</h2>
    <div id="add-step1">
      <label>
        証券コード・シンボル
        <input type="text" id="add-symbol-input" placeholder="例: 7203(日本株) / AAPL(米国株)">
      </label>
      <button id="add-lookup-btn">確認する</button>
    </div>
    <div id="add-step2" style="display:none;">
      <p id="add-lookup-result"></p>
      <label>
        会社の表示名
        <input type="text" id="add-name-input">
      </label>
      <label>
        市場区分(分からなければ空欄でOK)
        <input type="text" id="add-market-input" placeholder="例: 東証プライム">
      </label>
      <label>
        事業内容(空欄でもOK)
        <input type="text" id="add-business-input" placeholder="例: 自動車の製造・販売">
      </label>
      <div id="add-step2-buttons">
        <button id="add-confirm-btn">この内容で追加する</button>
        <button id="add-cancel-btn" type="button" class="btn-secondary">キャンセル</button>
      </div>
    </div>
    <p id="add-status-text"></p>
  </section>

  <section id="watchlist-section">
    <h2>ウォッチリスト</h2>
    <table id="watchlist-table">
      <thead>
        <tr>
          <th>状態</th>
          <th>種別</th>
          <th>銘柄</th>
          <th>前日比</th>
          <th>市場区分</th>
          <th>事業内容</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
